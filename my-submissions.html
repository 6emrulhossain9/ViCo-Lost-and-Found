<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Submissions - Campus Lost & Found</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="page-wrap">

    <header class="site-header">
      <div class="nav-inner">
        <a class="logo" href="index.html">
          <span class="logo-icon">🎒</span>
          <span>Campus Lost &amp; Found</span>
        </a>
        <nav class="main-nav">
          <a href="index.html">Home</a>
          <a href="add.html">Add Item</a>
          <a href="my-submissions.html">My Submissions</a>
          <span id="authNavItem"></span>
        </nav>
      </div>
    </header>

    <main class="container">
      <h1 class="page-title">My Submissions</h1>

      <!-- Auth gate — redirects to auth.html if not signed in -->
      <div class="login-card hidden" id="loginCard">
        <p class="text-muted mb-16">Please sign in to view your submissions.</p>
        <a href="auth.html?redirect=my-submissions.html" class="btn btn-primary btn-block">Sign In</a>
      </div>

      <!-- Submissions list -->
      <div class="hidden" id="submissionsView">
        <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; margin-bottom:16px;">
          <div>
            <p id="welcomeText" class="text-muted" style="margin:0;"></p>
            <div id="displayNameEdit" style="display:none;margin-top:6px;gap:6px;align-items:center;flex-wrap:wrap;">
              <input type="text" id="displayNameInput" maxlength="30" style="padding:6px 10px;border:1px solid var(--border);border-radius:6px;font-size:0.9rem;width:160px;">
              <button class="btn btn-primary btn-sm" id="saveDisplayNameBtn">Save</button>
              <button class="btn btn-outline btn-sm" id="cancelDisplayNameBtn">Cancel</button>
            </div>
          </div>
          <div style="display:flex;gap:6px;align-items:center;">
            <button class="btn btn-outline btn-sm" id="editNameBtn">✏️ Edit Name</button>
            <button class="btn btn-outline btn-sm" id="logoutBtn">Logout</button>
          </div>
        </div>

        <div id="submissionsList"></div>

        <div class="empty-state hidden" id="submissionsEmpty">
          <div class="empty-icon">📭</div>
          <p>You have not posted anything yet. <a href="add.html">Add an item</a></p>
        </div>
      </div>
    </main>

    <footer class="site-footer">
      <div class="footer-links">
        <a href="#about">About</a>
        <a href="mailto:lostfound@campus.edu">Contact</a>
      </div>
      <div>&copy; 2026 Campus Lost &amp; Found. Built for SD3 Web Application Development.</div>
    </footer>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase-config.js"></script>
  <script src="auth.js"></script>
  <script src="app.js"></script>
</body>
</html>
